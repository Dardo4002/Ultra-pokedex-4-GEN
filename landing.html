<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingPage Ultra-pokedex-4-GEN</title>

     <!-- Link BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/landing.css">
</head>
<body class="min-vh-100 d-flex flex-column ">

 <!-- Header con barra de navegación -->
  <header class="navbar navbar-expand-md bg-dark border-bottom border-body fixed-top" data-bs-theme="dark">
    <div class="container-fluid">
      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <img src="Media/Img/Poke_Ball_icon.webp" alt="Logo" width="30" height="30">
      </a>
      <!-- Botón para menú en móviles -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Menú de navegación -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="btn btn-custom me-2" href="#">Enter</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-custom me-2 " href="#contacto">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </header>

  <main class="flex-grow-1 d-flex flex-column h-100 mx-auto">
     <!-- Pokedex Items -->
     <section class="container-fluid flex-grow-1 d-flex justify-content-center px-5 my-5">
      <div class="pokedex-body d-flex justify-content-center align-items-center flex-column text-center px-4 py-5 col-12">
        <div class="screen mb-1 mx-auto d-flex align-items-center justify-content-center col-10 py-5">
          <h2 class="screen-title">Pokedex Items</h2>
        </div>
        <!-- <button class="add-button d-flex align-items-center justify-content-center">ENTER</button> -->
         <a href="index.html" class="add-button d-flex align-items-center justify-content-center">ENTER</a>
      </div>
    </section>


    <section class="container-fluid mb-5 px-5">
        <p class="custom-text border-bottom border-white border-3 pb-5"></p>

          <!-- Pokeball Container -->
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
            <!-- Imagen en su contenedor -->
            <div class="image-body d-flex justify-content-center align-items-center px-5 py-5 me-5">
              <div class="image-box">
                <img src="Media/Img/Poción.webp" alt="Poción" class="img-fluid" width="120">
              </div>
            </div>
            <!-- Texto separado -->
            <div class="text-end flex-grow-1 pe-4">
              <p class="custom-text fs-1 mb-5 text-white">All the pokemon<br><strong>OBJECTS</strong></p>
              <div class=" mx-auto" style="width:50%; border-bottom:3px solid white;"></div>
            </div>
          </div>

          <!-- Spray Container -->
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
            <div class="text-start flex-grow-1 pe-4">
              <p class="custom-text fs-1 mb-5 text-white">In one<br><strong>POKEDEX</strong></p>
              <div class=" mx-auto" style="width:50%; border-bottom:3px solid white;"></div>
            </div>
            <div class="image-body d-flex justify-content-center align-items-center px-5 py-5 me-5">
              <div class="image-box">
                <img src="Media/Img/Repartir_experiencia.webp" alt="Repartir_experiencia" class="img-fluid" width="120">
              </div>
            </div>
          </div>

          <!-- Banana Container -->
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
            <div class="image-body d-flex justify-content-center align-items-center px-5 py-5 me-5">
              <div class="image-box">
                <img src="Media/Img/Gafas_especiales.webp" alt="Gafas" class="img-fluid" width="120">
              </div>
            </div>
            <div class="text-end flex-grow-1 pe-4 d-flex justify-content-center">
              <p class="custom-text fs-1 mb-5 text-white">Don't wait<br><strong>to ENTER!!</strong></p>
              <div class=" mx-auto" style="width:50%; border-bottom:3px solid white;"></div>
            </div>
          </div>

          <p class="custom-text border-bottom border-white border-3 pb-5"></p>
    </section>

   <section class="container-fluid flex-grow-1 d-flex justify-content-center px-5">
      <div class="gen4-body d-flex justify-content-center align-items-center flex-column text-center px-4 py-5 col-12">
        <div class="screenGen4 mb-4 mx-auto d-flex align-items-center justify-content-center col-10 py-5">
          <h2 class="screen-title">GEN 4</h2>
        </div>
        <!-- <div class="d-flex justify-content-center gap-4">
          <img src="Media/Img/Pok_Perla.webp" alt="Perla" class="img-fluid" style="max-width: 300px;">
          <img src="Media/Img/Pok_Platino.webp" alt="Platino" class="img-fluid" style="max-width: 300px;">
          <img src="Media/Img/Pok_Diamante.webp" alt="Diamante" class="img-fluid" style="max-width: 300px;">
        </div> -->

        <div class="row justify-content-center g-4">
          <div class="col-12 col-md-4 d-flex justify-content-center">
              <img src="Media/Img/Pok_Perla.webp" alt="Perla" class="img-fluid" style="max-width: 300px;">
          </div>
          <div class="col-12 col-md-4 d-flex justify-content-center">
              <img src="Media/Img/Pok_Platino.webp" alt="Platino" class="img-fluid" style="max-width: 300px;">
          </div>
          <div class="col-12 col-md-4 d-flex justify-content-center">
              <img src="Media/Img/Pok_Diamante.webp" alt="Diamante" class="img-fluid" style="max-width: 300px;">
          </div>
        </div>
      </div>
  </section>
  <div class="d-flex align-items-center justify-content-center">
      <p class="carrousellText mb-1 mt-4 text-white d-flex align-items-center"><strong>UPCOMING</strong><br>Generations</p>
     </div>

    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicadores de posición (opcional) -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
      </div>

    <!-- Slides -->
     
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../Media/Img/Gen-5.webp" class="d-block w-100" alt="Imagen 1">
        </div>
        <div class="carousel-item">
          <img src="../Media/Img/gen6.webp" class="d-block w-100" alt="Imagen 2">
        </div>
        <div class="carousel-item">
          <img src="../Media/Img/Gen-7-_1_.webp" class="d-block w-100" alt="Imagen 3">
        </div>
      </div>

      <!-- Controles de navegación -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>

      
   </div>
   

  </main>

  <footer style="background-color: #121212;" class="text-white py-4 mt-5" id="contacto">
    <div class="container-fluid">
      <div class="row">
        <!-- Información de contacto -->
        <div class="col-md-6 mb-3 mb-md-0">
          <h5>Contacto del equipo</h5>
          <ul class="list-unstyled">
            <li><i class="bi bi-envelope-fill me-2"></i>equipo@ejemplo.com</li>
            <li><i class="bi bi-phone-fill me-2"></i>+34 123 456 789</li>
            <li><i class="bi bi-geo-alt-fill me-2"></i>Madrid, España</li>
          </ul>
        </div>

        <!-- Enlaces rápidos -->
        <div class="col-md-6 text-md-end">
          <h5>Síguenos</h5>
          <a href="https://x.com/?lang=es" class="text-white me-3"><i class="bi bi-twitter"></i></a>
          <a href="https://www.facebook.com/?locale=es_ES" class="text-white me-3"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/" class="text-white me-3"><i class="bi bi-instagram"></i></a>
        </div>
      </div>

      <hr class="border-secondary mt-4">

      <div class="text-center small text-secondary">
        © 2025 Equipo Pokedex. Todos los derechos reservados.

    </div>
</footer>
