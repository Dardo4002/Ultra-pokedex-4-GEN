  <main class="flex-grow-1 d-flex flex-column ">

          <h2 class="screen-title">Pokedex Items</h2>
        </div>
        <button class="add-button d-flex align-items-center justify-content-center">+</button>
      </div>
    </section>

    <section class="container mb-5">

  <!-- Pokeball Container -->
  <div class="d-flex align-items-center justify-content-start mb-4 flex-wrap">
    <!-- Imagen en su contenedor -->
    <div class="pokedex-body d-flex justify-content-center align-items-center px-4 py-4 me-3">
      <div class="image-box">
        <img src="pokeball.png" alt="Pokebola" class="img-fluid" width="120">
      </div>
    </div>
    <!-- Texto separado -->
    <div>
      <p class="custom-text fs-4">All the pokemon<br><strong>OBJECTS</strong></p>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-start mb-4 flex-wrap">

      </div>
    </div>
    <div>
      <p class="custom-text fs-4">In one<br><strong>POKEDEX</strong></p>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-start mb-4 flex-wrap">
    <div class="pokedex-body d-flex justify-content-center align-items-center px-4 py-4 me-3">
